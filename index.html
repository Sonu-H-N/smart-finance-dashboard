<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Track income, expenses, and balance with charts, PDF reports, and smart spending insights.">
<title>Smart Finance Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b82f6">

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<header>
    <button id="themeToggle">🌙</button>
    <button onclick="logout()">Logout 🚪</button>
    <h1>💰 Smart Finance Dashboard</h1>
</header>

<div class="container">

    <div class="balance-card">
        <h2>Your Balance</h2>
        <h1 id="balance">₹0</h1>
    </div>

    <div class="summary">
        <div class="income">
            <h3>Income</h3>
            <p id="income">₹0</p>
        </div>

        <div class="expense">
            <h3>Expense</h3>
            <p id="expense">₹0</p>
        </div>
    </div>

    <div class="transaction-form">
        <h3>Add Transaction</h3>

        <input type="text" id="text" placeholder="Enter description">

        <div class="type-toggle">
            <button type="button" id="typeIncome" class="type-btn active" onclick="setTransactionType('income')">↑ Income</button>
            <button type="button" id="typeExpense" class="type-btn" onclick="setTransactionType('expense')">↓ Expense</button>
        </div>

        <select id="category">
            <option value="Food">🍔 Food</option>
            <option value="Travel">🚗 Travel</option>
            <option value="Bills">💡 Bills</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Salary">💼 Salary</option>
            <option value="Other">📦 Other</option>
        </select>

        <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">

        <button onclick="addTransaction()">Add Transaction</button>
    </div>

    <div class="analysis">
        <h3>🤖 Smart Insight</h3>
        <button onclick="getAIAdvice()">Refresh Insight</button>
        <div id="analysis" class="insight-list">Add a few transactions to see your insights.</div>
    </div>

    <!-- PDF Button -->
    <div style="margin-top:20px;">
        <button onclick="downloadPDF()">Download Report 📄</button>
    </div>

    <div class="history">
        <h3>Transaction History</h3>
        <ul id="list"></ul>
    </div>

    <!-- Chart -->
    <div class="chart-container">
        <h3>Finance Overview</h3>
        <canvas id="financeChart"></canvas>
    </div>

</div>

<!-- Scripts -->
<script src="script.js"></script>

</body>
</html>
